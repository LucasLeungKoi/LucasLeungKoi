# Daily git-koi: generate with contents:read, then commit GIF only if it changed.
# Pinned: actions/checkout@v7.0.1, git-koi v1.0.2 (full SHA), artifact actions v7/v8.
# Artifact upload/download in the same run use the Actions artifact API (digest-checked
# on download per GitHub docs); no extra GITHUB_TOKEN actions:* scope required for that.
name: Koi

on:
  schedule:
    # 00:20 UTC ≈ 08:20 HKT (no DST)
    - cron: "20 0 * * *"
  workflow_dispatch:

concurrency:
  group: koi-${{ github.repository }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - uses: yalongwastaken/git-koi@7305e9b1fadee6f43d3b4fa543a25d4cde79856e # v1.0.2
        with:
          login: LucasLeungKoi
          body: white
          output-dir: koi
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: koi-gif
          path: koi/koi.gif
          if-no-files-found: error

  commit:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: koi-gif
          path: .
      - name: Commit the koi if it changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p koi
          if [[ -f koi/koi.gif ]]; then
            :
          elif [[ -f koi.gif ]]; then
            mv koi.gif koi/koi.gif
          else
            echo "artifact did not yield koi.gif or koi/koi.gif" >&2
            exit 1
          fi
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git commit --quiet --message "chore(koi): update daily koi.gif"
          git push --quiet
